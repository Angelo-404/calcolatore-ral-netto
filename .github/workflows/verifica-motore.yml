name: Verifica il motore di calcolo

# La suite di regressione viveva solo dentro la pagina, dietro un bottone: era
# eseguibile, ma nessuno la eseguiva prima di un commit. Un errore nei conti
# poteva quindi arrivare in produzione passando accanto a 89 test verdi che
# nessuno aveva fatto girare. Qui girano a ogni push, insieme ai controlli di
# integrita' del dataset, che fino a oggi partivano solo dentro il workflow
# di aggiornamento delle aliquote.

on:
  push:
    paths:
      - 'index.html'
      - 'build/**'
      - '.github/workflows/verifica-motore.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'build/**'
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: La suite di regressione del motore
        run: node build/prova_motore.js

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrita' del dataset territoriale
        run: python build/verifica_dataset.py

      # Il modulo Node serve a rieseguire i calcoli fuori dal browser: se il
      # taglio non e' piu' possibile lo script esce in errore, ed e' bene
      # accorgersene qui invece che al prossimo controllo a mano.
      - name: Il motore resta estraibile come modulo Node
        run: python build/estrai_motore.py

name: Verifica il foglio di stile

# Il CSS di Tailwind non arriva piu' da una CDN: e' compilato e incorporato in
# index.html. E' contenuto generato, quindi puo' restare indietro rispetto al
# markup — una classe aggiunta a mano e mai ricompilata semplicemente non ha
# regole, e il difetto si vede solo guardando la pagina. Questo controllo
# ricompila e confronta: se il blocco non corrisponde al markup, fallisce.

on:
  push:
    paths:
      - 'index.html'
      - 'build/costruisci_css.js'
      - '.github/workflows/verifica-css.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'build/costruisci_css.js'
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Il CSS in pagina corrisponde al markup
        run: node build/costruisci_css.js --verifica
